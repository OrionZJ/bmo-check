[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bmo-check"
version = "0.4.0"
description = "Dynamic trace-scoped memory-order verifier for DBT6 mo-off"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "angr",
    "capstone",
    "duckdb>=1.1",
    "networkx",
    "pydantic>=2",
    "pyelftools",
    "PyYAML",
    "z3-solver",
]

[project.scripts]
bmo-check = "bmo_check_dynamic.cli:main"
bmo-check-static = "bmo_check_static.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bmo_check_core", "src/bmo_check_dynamic", "src/bmo_check_static", "src/bmo_check_diagnostics", "src/bmo_check_evaluation", "src/bmo_check_cli"]

[tool.hatch.build.targets.wheel.force-include]
"specs/dynamic/dbt6-mo-off.yaml" = "bmo_check_dynamic/data/dbt6-mo-off.yaml"
"specs/static/dbt6-mo-off.yaml" = "bmo_check_static/data/dbt6-mo-off.yaml"
"specs/static/library-effects.yaml" = "bmo_check_static/data/library-effects.yaml"
"specs/static/parsec-simlarge.yaml" = "bmo_check_static/data/parsec-simlarge.yaml"
"specs/static/parsec-portfolio.yaml" = "bmo_check_static/data/parsec-portfolio.yaml"
"specs/static/pthread-api.yaml" = "bmo_check_static/data/pthread-api.yaml"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["bmo_check_core", "bmo_check_dynamic", "bmo_check_static", "bmo_check_diagnostics", "bmo_check_evaluation"]
