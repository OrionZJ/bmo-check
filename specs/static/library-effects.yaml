    integer_arguments: []
  cosf:
    effect: thread_local
    integer_arguments: []
  # swaptions 的随机数 helper 只写调用者栈上的 seed；它不会拿到
  # HJM fresh heap 矩阵。契约只允许跨调用保留 heap 字段，stack 字段仍清除。
  _Z7RanUnifPl:
    effect: argument_access
    integer_arguments: [0]
    memory_arguments:
      - index: 0
        mode: write

  # canneal 的随机数 helper 只读取 Rng 中保存的 MTRand 指针，或写入
  # 显式输出参数；反汇编没有发现写回调用者的指针字段。保留这类字段
  # 摘要，才能让同一个 worker 的 Rng 在多层 helper 后继续指向独立状态。
  _ZN7netlist18get_random_elementEPllP3Rng:
    effect: field_preserving
    integer_arguments: [0, 1, 2, 3]
    preserve_heap_fields: true
  _ZN3Rng4randEi:
    effect: field_preserving
    integer_arguments: [0, 1]
    preserve_heap_fields: true
  _ZN15annealer_thread11accept_moveEddP3Rng:
    effect: field_preserving
    integer_arguments: [0, 1]
    preserve_heap_fields: true
