schema: 1
contract_version: linux-runtime-effects-v4

# 这些函数可以修改 errno 或浮点环境，但在 Linux pthread ABI 中二者都属于当前线程。
# 契约只消除共享内存 effect；二进制模块仍由 manifest 的 SHA-256 单独绑定。
functions:
  malloc:
    # allocator 仍是 Unknown，只是它的隐藏元数据不会别名到尚在使用的应用对象。
    effect: fresh_allocation
    integer_arguments: [0]
    internal_object: "runtime:allocator"
  free:
    # 这条依赖无 use-after-free 的执行 scope。free 之后的对象不再是有效通信对象。
    effect: runtime_internal
    integer_arguments: [0]
    internal_object: "runtime:allocator"
  calloc:
    effect: fresh_allocation
    integer_arguments: [0, 1]
    internal_object: "runtime:allocator"
  _Znwm:
    effect: fresh_allocation
    integer_arguments: [0]
    internal_object: "runtime:allocator"
  _Znam:
    effect: fresh_allocation
    integer_arguments: [0]
    internal_object: "runtime:allocator"
  _ZdlPv:
    effect: runtime_internal
    integer_arguments: [0]
    internal_object: "runtime:allocator"
  _ZdaPv:
    effect: runtime_internal
    integer_arguments: [0]
    internal_object: "runtime:allocator"
  _ZNSaIcED2Ev:
    effect: runtime_internal
    integer_arguments: [0]
    internal_object: "runtime:allocator"
  _ZdlPvm:
    effect: runtime_internal
    integer_arguments: [0, 1]
    internal_object: "runtime:allocator"
  _ZdaPvm:
    effect: runtime_internal
    integer_arguments: [0, 1]
    internal_object: "runtime:allocator"
  memcpy:
    effect: argument_access
    integer_arguments: [0, 1, 2]
    memory_arguments:
      - index: 0
        mode: write
      - index: 1
        mode: read
  memmove:
    effect: argument_access
    integer_arguments: [0, 1, 2]
    memory_arguments:
      - index: 0
        mode: write
      - index: 1
        mode: read
  memset:
    effect: argument_access
    integer_arguments: [0, 1, 2]
    memory_arguments:
      - index: 0
        mode: write
  memcmp:
    effect: argument_access
    integer_arguments: [0, 1, 2]
    memory_arguments:
      - index: 0
        mode: read
      - index: 1
        mode: read
  bzero:
    effect: argument_access
    integer_arguments: [0, 1]
    memory_arguments:
      - index: 0
        mode: write
  strcmp:
    effect: argument_access
    integer_arguments: [0, 1]
    memory_arguments:
      - index: 0
        mode: read
      - index: 1
        mode: read
  strncmp:
    effect: argument_access
    integer_arguments: [0, 1, 2]
    memory_arguments:
      - index: 0
        mode: read
      - index: 1
        mode: read
  strlen:
    effect: argument_access
    integer_arguments: [0]
    memory_arguments:
      - index: 0
        mode: read
  strcpy:
    effect: argument_access
    integer_arguments: [0, 1]
    memory_arguments:
      - index: 0
        mode: write
      - index: 1
        mode: read
  strncpy:
    effect: argument_access
    integer_arguments: [0, 1, 2]
    memory_arguments:
      - index: 0
        mode: write
      - index: 1
        mode: read
  fopen:
    effect: argument_access
    integer_arguments: [0, 1]
    memory_arguments:
      - index: 0
        mode: read
      - index: 1
        mode: read
    internal_object: "runtime:stdio"
  fclose:
    effect: runtime_internal
    integer_arguments: [0]
    internal_object: "runtime:stdio"
  fflush:
    effect: runtime_internal
    integer_arguments: [0]
    internal_object: "runtime:stdio"
  fread:
    effect: argument_access
    integer_arguments: [0, 1, 2, 3]
    memory_arguments:
      - index: 0
        mode: write
    internal_object: "runtime:stdio"
  fwrite:
    effect: argument_access
    integer_arguments: [0, 1, 2, 3]
    memory_arguments:
      - index: 0
        mode: read
    internal_object: "runtime:stdio"
  fputs:
    effect: argument_access
    integer_arguments: [0, 1]
    memory_arguments:
      - index: 0
        mode: read
    internal_object: "runtime:stdio"
  getc:
    effect: runtime_internal
    integer_arguments: [0]
    internal_object: "runtime:stdio"
  fputc:
    effect: runtime_internal
    integer_arguments: [0, 1]
    internal_object: "runtime:stdio"
  atoi:
    effect: argument_access
    integer_arguments: [0]
    memory_arguments:
      - index: 0
        mode: read
  exp:
    effect: thread_local
    integer_arguments: []
  expf:
    effect: thread_local
    integer_arguments: []
  log:
    effect: thread_local
    integer_arguments: []
  logf:
    effect: thread_local
